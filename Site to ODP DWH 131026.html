/* Layout: peta penuh layar, panel kontrol melayang di kiri atas (desktop) dan jadi panel bawah di HP */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --fg:#14222b; --muted:#5b6b75; --line:#d5dde1;
  --accent:#0b6e8a; --accent-fg:#ffffff; --site:#15324a;
  --s-green:#1f9d62; --s-yellow:#e2a50f; --s-red:#d6453f; --s-black:#2a2f33; --s-anom:#8a4fd1;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161b; --panel:#17222a; --fg:#e6edf0; --muted:#9db0ba; --line:#2b3b45;
  --accent:#4cc3e0; --accent-fg:#06222b; --site:#8fc4e8; --s-black:#c9d1d5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161b; --panel:#17222a; --fg:#e6edf0; --muted:#9db0ba; --line:#2b3b45;
  --accent:#4cc3e0; --accent-fg:#06222b; --site:#8fc4e8; --s-black:#c9d1d5; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--sans);background:var(--bg)}
.panel{position:absolute;z-index:500;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#ctrl{top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:340px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);display:flex;flex-direction:column}
#ctrl header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#ctrl h1{font-size:15px;font-weight:600;margin:0}
#ctrl .count{font-family:var(--mono);font-size:11px;color:var(--muted)}
#body{padding:10px 12px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
#toggle{display:none;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px}
label.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.row{display:flex;gap:6px;min-width:0}
input[type=text],select{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;font:inherit;font-family:var(--mono);font-size:13px}
button.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:8px 11px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.on{outline:2px solid var(--accent);outline-offset:1px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px}.seg button{flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.4;margin:0}
.msg{font-size:12px;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--s-red)}
#info{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
#info b{font-family:var(--mono);font-weight:500}
#info .dist{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.near{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.near li{display:flex;justify-content:space-between;gap:8px;padding:6px 4px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px}
.near li:hover{background:var(--bg)}
.near .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.35)}
.chk{display:flex;flex-wrap:wrap;gap:6px 12px}
.chk label{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.bm{position:absolute;z-index:500;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}

.site-ic{display:flex;flex-direction:column;align-items:center}

function popup(o){
  const ll=o.lat.toFixed(6)+', '+o.lon.toFixed(6);
  const rows=o.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  return `<div class="pop"><h3>${o.name}</h3><table>${rows}<tr><td>Koordinat</td><td style="font-family:monospace">${ll}</td></tr></table>
  <div class="acts"><button data-act="go" data-lat="${o.lat}" data-lon="${o.lon}" data-name="${o.name}">Jadikan tujuan</button></div></div>`;
}
function odpMarker(o){
  const [name,lat,lon,av,us,tot,st,sto,oc]=o;
  const m=L.circleMarker([lat,lon],{radius:6,weight:1.5,color:'#fff',fillColor:SCOL[st]||'#888',fillOpacity:.95});
  m.bindPopup(()=>popup({name,lat,lon,rows:[['STO',sto],['Port',`${us} terpakai / ${tot} (sisa ${av})`],['OCC 1',pct(oc)],['OCC 2',SDESC[st]||st]]}));

}

let odpLayer=null;
function clusterIcon(c){const n=c.getChildCount();const d=n<100?30:n<1000?38:46;return L.divIcon({html:`<div class="cl" style="width:${d}px;height:${d}px">${n}</div>`,className:'',iconSize:[d,d]})}
function rebuild(){
  if(odpLayer)map.removeLayer(odpLayer);

  if($('cOdp').checked)odpLayer.addTo(map);
  $('count').textContent=`${list.length.toLocaleString('id-ID')} ODP · ${SITE.length} site`;
}

/* ---------- lokasi saya, tujuan, rute ---------- */
let me=null,target=null,mode='O',meM=null,tgM=null,line=null,watchId=null;
const meIcon=L.divIcon({className:'',html:'<div class="me-ic"></div>',iconSize:[18,18]});
const tgIcon=L.divIcon({className:'',html:'<div class="tg-ic"></div>',iconSize:[22,22],iconAnchor:[11,22]});
function km(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;
  const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const fmt=d=>d<1?Math.round(d*1000)+' m':d.toFixed(d<10?2:1)+' km';
function setMe(ll,pan){me=ll;if(meM)meM.setLatLng(ll);else meM=L.marker(ll,{icon:meIcon,zIndexOffset:2000}).addTo(map).bindTooltip('Posisi saya');if(pan)map.setView(ll,Math.max(map.getZoom(),15));refresh()}
function setTarget(ll,name,pan){target=ll;$('tname').textContent=name||'Titik tujuan';if(tgM)tgM.setLatLng(ll);else tgM=L.marker(ll,{icon:tgIcon,zIndexOffset:1900}).addTo(map);if(pan)map.setView(ll,Math.max(map.getZoom(),15));refresh()}
function refresh(){
  if(line){map.removeLayer(line);line=null}
  const ref=target||me;
  if(target){
    $('info').hidden=false;
    const o=me?`&origin=${me[0]},${me[1]}`:'';
    $('gmaps').href=`https://www.google.com/maps/dir/?api=1${o}&destination=${target[0]},${target[1]}&travelmode=driving`;
    $('dist').textContent=me?`${fmt(km(me,target))} garis lurus`:`${target[0].toFixed(6)}, ${target[1].toFixed(6)}`;
    $('routeHint').textContent=me?'Rute dibuka di Google Maps dari posisi saya. Jarak di atas garis lurus, jarak jalan bisa lebih jauh.':'Posisi saya belum ada. Google Maps akan memakai GPS HP sebagai titik awal.';
    if(me)line=L.polyline([me,target],{color:'#2f7de1',weight:3,dashArray:'6 8'}).addTo(map);
  }else $('info').hidden=true;
  nearest(ref);
}
function nearest(ref){
  const ul=$('near');
  if(!ref){ul.innerHTML='<li class="hint">Isi tujuan atau aktifkan GPS.</li>';return}
  const fs=$('fSto').value,fo=$('fOcc').value;
  const arr=[];
  for(const o of ODP){if((fs&&o[7]!==fs)||(fo&&o[6]!==fo))continue;const d=km(ref,[o[1],o[2]]);if(arr.length<5||d<arr[arr.length-1].d){arr.push({o,d});arr.sort((a,b)=>a.d-b.d);if(arr.length>5)arr.pop()}}
  ul.innerHTML='';
  arr.forEach(({o,d})=>{const li=document.createElement('li');li.innerHTML=`<span><i class="dot" style="background:${SCOL[o[6]]||'#888'}"></i>${o[0]}</span><span class="d">${fmt(d)}</span>`;
    li.onclick=()=>{map.setView([o[1],o[2]],18);L.popup().setLatLng([o[1],o[2]]).setContent(popup({name:o[0],lat:o[1],lon:o[2],rows:[['STO',o[7]],['Port',`${o[4]} terpakai / ${o[5]} (sisa ${o[3]})`],['OCC 1',pct(o[8])],['OCC 2',SDESC[o[6]]||o[6]]]})).openOn(map)};ul.appendChild(li)});
}
function locate(){
  const msg=$('qmsg');
  if(!navigator.geolocation){msg.className='msg err';msg.textContent='GPS tidak tersedia di tampilan ini. Pakai mode "Posisi saya" lalu ketuk peta, atau buka peta di browser HP.';return}
  msg.className='msg';msg.textContent='Mencari posisi...';
  let first=true;
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(p=>{msg.textContent=`Posisi akurat sekitar ${Math.round(p.coords.accuracy)} m`;setMe([p.coords.latitude,p.coords.longitude],first);first=false},
    e=>{msg.className='msg err';msg.textContent='GPS tidak bisa dipakai ('+(e.message||e.code)+'). Buka link ini langsung di browser HP, atau ketuk peta dengan mode "Posisi saya".'},
    {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
$('bLoc').onclick=locate;
function setMode(m){mode=m;[['T','mT'],['M','mM'],['O','mO']].forEach(([k,id])=>$(id).classList.toggle('on',k===m));map.getContainer().style.cursor=m==='O'?'':'crosshair'}
$('mT').onclick=()=>setMode('T');$('mM').onclick=()=>setMode('M');$('mO').onclick=()=>setMode('O');
map.on('click',e=>{const ll=[e.latlng.lat,e.latlng.lng];if(mode==='T')setTarget(ll,'Titik pilihan di peta');else if(mode==='M')setMe(ll,false)});
$('clr').onclick=()=>{target=null;if(tgM){map.removeLayer(tgM);tgM=null}refresh()};
map.getContainer().addEventListener('click',e=>{const b=e.target.closest('[data-act="go"]');if(b){setTarget([+b.dataset.lat,+b.dataset.lon],b.dataset.name,false);map.closePopup()}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act="go"]');if(b&&!map.getContainer().contains(b)){}});

/* ---------- pencarian ---------- */
function search(){
  const v=$('q').value.trim(),msg=$('qmsg');msg.className='msg';msg.textContent='';
  if(!v)return;
  const m=v.replace(/[°;]/g,' ').match(/(-?\d+(?:[.,]\d+)?)\s*[,\s]\s*(-?\d+(?:[.,]\d+)?)/);
  if(m){
    let a=parseFloat(m[1].replace(',','.')),b=parseFloat(m[2].replace(',','.'));
    if(Math.abs(a)>90&&Math.abs(b)<=90)[a,b]=[b,a];
    if(Math.abs(a)>90||Math.abs(b)>180){msg.className='msg err';msg.textContent='Koordinat di luar jangkauan.';return}
    setTarget([a,b],'Koordinat '+a.toFixed(6)+', '+b.toFixed(6),true);return;
  }
  const q=v.toLowerCase();
  const s=SITE.find(x=>x[0].toLowerCase()===q||x[1].toLowerCase().includes(q));
  if(s){setTarget([s[2],s[3]],'Site '+s[0]+' · '+s[1],true);return}
  let o=ODP.find(x=>x[0].toLowerCase()===q)||ODP.find(x=>x[0].toLowerCase().includes(q));
  if(o){setTarget([o[1],o[2]],'ODP '+o[0],true);return}
  msg.className='msg err';msg.textContent='Tidak ketemu. Tulis koordinat "lat, lon" atau nama ODP/site.';
}
$('go').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('toggle').onclick=()=>{const c=$('ctrl').classList.toggle('min');$('toggle').textContent=c?'Buka':'Tutup';$('toggle').setAttribute('aria-expanded',String(!c))};
</script>
